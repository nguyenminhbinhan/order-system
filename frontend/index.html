<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#135bec">
    <meta name="description" content="Quán ăn Bình An - Hệ thống gọi món QR">
    <title>Bình An - Quán ăn</title>
    <!-- Anti-flash: apply dark mode BEFORE first paint -->
    <script>
      (function() {
        var theme = localStorage.getItem('binh_an_theme') || 'system';
        var isDark = theme === 'dark' || 
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  </head>
  <body class="bg-background-light dark:bg-background-dark">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
